/* ---------- sleep helpers ---------- */
function parseBedtimeMinutes(bt){
  if(!bt) return null;
  const parts = bt.split(':').map(Number);
  if(parts.length < 2 || isNaN(parts[0])) return null;
  return parts[0]*60 + (parts[1]||0);
}
function avgBedtime(records){
  const recent = records.filter(x=>x.bedtime).slice(-7);
  if(!recent.length) return '--';
  const mins = recent.map(x=>parseBedtimeMinutes(x.bedtime)).filter(x=>x!==null);
  if(!mins.length) return '--';
  const avg = mins.reduce((a,b)=>a+b,0) / mins.length;
  const h = Math.floor(avg/60);
  const m = Math.round(avg%60);
  return `${h}:${String(m).padStart(2,'0')}`;
}

/* ---------- body helpers ---------- */
function bodyTrend(records, field){
  if(records.length < 2) return 'flat';
  const latest = records[records.length-1];
  const prev = records[records.length-2];
  const lv = +latest[field] || 0;
  const pv = +prev[field] || 0;
  if(lv > pv) return 'up';
  if(lv < pv) return 'down';
  return 'flat';
}

function initCloudSync(){
  if(!fbDB || fbAuthReady) return;
  fbAuthReady = true;
  setSyncStatus('syncing');

  fbSyncing = true;
  fbDB.ref('data').once('value').then(snap => {
    const cloud = snap.val();
    if(cloud && (cloud.__updated || 0) >= (data.__updated || 0)){
      data = cloud;
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
      render();
    } else if(!cloud) {
      data.__updated = Date.now();
      fbDB.ref('data').set(data);
    }
    fbSyncing = false;
    setSyncStatus('synced');
  }).catch(e => { fbSyncing = false; setSyncStatus('offline'); });

  fbDB.ref('data').on('value', snap => {
    if(fbSyncing) return;
    fbSyncing = true;
    const cloud = snap.val();
    if(cloud && (cloud.__updated || 0) > (data.__updated || 0)){
      data = cloud;
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
      render();
      setSyncStatus('synced');
    }
    fbSyncing = false;
  });

  window.cloudSave = function(){
    if(fbSyncing) return;
    setSyncStatus('syncing');
    data.__updated = Date.now();
    fbDB.ref('data').set(data).then(() => {

  const text = input.value.trim();
  if(!text) return;
  if(!data.__memos) data.__memos = [];
  data.__memos.unshift({ id:'m'+Date.now(), text, date:isoToday(), time:new Date().toTimeString().slice(0,5), type: type || 'note' });
  store.save();
  input.value = '';
  if(type === 'feedback'){
    showToast('已记录 · 请在对话中发送给我以获取回复');
  } else {
    showToast('已记录');
  }
}

/* ============================================================
   INSIGHT — 修改版
   ============================================================ */
function renderInsight(){
  const bars = CONFIG.modules.map(m=>{
    const it = data[m.key] || [];
    let pct = 0, label = "";
    if(m.key === "training"){
      pct = CONFIG.stageGoals[0].progress;
      const remaining = 100 - pct;
      label = `距薄肌身材 约${remaining}天`;
    } else if(m.key === "money"){
      const todayExp = todayExpense();
      const monthExp = monthExpense();
      label = `今日 ¥${fmtMoney(todayExp)} · 本月 ¥${fmtMoney(monthExp)}`;
      pct = Math.min(100, Math.round(monthExp / 100));
    } else if(m.key === "body"){
      const latest = it[it.length-1];
      if(latest && latest.bodyFat){
        const trend = bodyTrend(it, 'bodyFat');
        const arrow = trend==='down'?' ↓趋势良好':trend==='up'?' ↑需注意':' →持平';
        label = `体脂${latest.bodyFat}%${arrow}`;
        pct = Math.max(0, Math.min(100, Math.round((1 - (+latest.bodyFat-12)/10) * 100)));
      } else { label = "暂无数据"; }
    } else if(m.key === "diet"){
      const nut = todayNutrition();
      label = `今日热量${Math.round(nut.calories)}/${CONFIG.nutrition.calories}kcal`;
      pct = Math.min(100, Math.round(nut.calories / CONFIG.nutrition.calories * 100));
    } else if(m.key === "sleep"){
      const sleepAvg = avgBedtime(it);
      const mins = parseBedtimeMinutes(sleepAvg);
      let status = "良好";
      if(mins !== null){
        if(mins >= 120) status = "偏晚";
        else status = "良好";
      }
      label = `平均入睡${sleepAvg} · ${status}`;
      const recent = it.filter(x=>x.bedtime).slice(-7);
      const goodCount = recent.filter(x=>{
        const bm = parseBedtimeMinutes(x.bedtime);
        return bm !== null && bm < 120;
      }).length;
      pct = recent.length ? Math.round(goodCount/recent.length*100) : 0;
    } else if(m.type === "todo"){
      const d = it.filter(x=>x.done).length;
      pct = it.length ? Math.round(d/it.length*100) : 0;
      label = `${d}/${it.length}`;
    } else if(m.type === "checkin"){
      const t = today();
      const d = it.filter(x=>x.log&&x.log[t]).length;
      pct = it.length ? Math.round(d/it.length*100) : 0;
      label = `${d}/${it.length}`;
    } else if(m.type === "progress"){
      pct = avgProgress(it).value;
      label = `${pct}%`;
    } else {
      label = `${it.length} 条`;
    }
    return {m, pct, label};
  });
  const barList = bars.map(b=>`<div class="bar-row" data-open="${b.m.key}" role="button" tabindex="0">
    <span class="bar-ic" style="color:${b.m.color}">${icon(b.m.icon,17)}</span>
    <span class="bar-name">${b.m.name}</span>
    <div class="pbar"><i style="width:${Math.min(100,b.pct)}%;background:${b.m.color}"></i></div>
    <span class="bar-pct">${b.label}</span></div>`).join("");

  $("#screen").innerHTML = `<div class="greet"><div><h1>洞察</h1><p>各模块进展一览 · 记录—执行—统计—反馈</p></div></div>
    <div class="sec-title">模块状态</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 各模块进展</div>
      <div class="bar-list" style="margin-top:12px">${barList}</div></div>`;
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
}

/* ============================================================
   MODULE VIEW — 分发到自定义渲染器
   ============================================================ */
function renderModule(key){
  // 自定义渲染器
  if(key === "training") { renderTraining(); return; }
  if(key === "money") { renderMoney(); return; }
  if(key === "body") { renderBody(); return; }
  if(key === "diet") { renderDiet(); return; }
  if(key === "sleep") { renderSleep(); return; }

  // 默认：基于 type 的渲染（todo, checkin, mantra）
  const m = modOf(key); const it = data[key] || [];
  const t = today();
  let head = "", extra = "";
  if(m.type === "todo"){
    const done = it.filter(x=>x.done).length;
    const pct = it.length ? Math.round(done/it.length*100) : 0;
    head = headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type === "checkin"){
    const done = it.filter(x=>x.log&&x.log[t]).length;
    const pct = it.length ? Math.round(done/it.length*100) : 0;
    head = headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type === "progress"){
    const p = avgProgress(it);
    head = headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type === "note"){
    const todayN = it.filter(x=>x.date===t).length;
    head = headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type === "checkin") extra = renderCalendar(m, it);
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:14px">${head}${extra}
      <div class="sec-title">记录</div>${body}</div>`;
  wireModule(key);
}

function headHero(m, big, label, pct){
  const inner = `<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
      <span style="font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums">${big}</span>
      <span style="font-size:12px;color:var(--text-secondary)">${label}</span></div>
    ${pct!=null?`<div class="pbar" style="height:6px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:8px"><i style="display:block;height:100%;width:${Math.min(100,pct)}%;background:${m.color};border-radius:999px"></i></div>`:''}</div>`;
  return `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--border);box-shadow:var(--shadow-card)">${inner}</div>`;
}

/* ============================================================
   MONEY MODULE — 支付宝风格
   ============================================================ */
let moneyFilter = 'all';
let moneyCatFilter = null;

function renderMoney(){
  const m = modOf("money"); const it = (data.money || []).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const ym = isoToday().slice(0,7);

  // 月度汇总
  const monthInc = it.filter(x=>x.type==="income" && (x.date||"").startsWith(ym)).reduce((s,x)=>s+ +x.amount, 0);
  const monthExp = it.filter(x=>x.type==="expense" && (x.date||"").startsWith(ym)).reduce((s,x)=>s+ +x.amount, 0);
  const balance = monthInc - monthExp;
  const summary = `<div class="mod-summary">
    <div class="mini"><div class="l">本月收入</div><div class="v" style="color:var(--module-1)">¥${fmtMoney(monthInc)}</div></div>
    <div class="mini"><div class="l">本月支出</div><div class="v" style="color:var(--danger)">¥${fmtMoney(monthExp)}</div></div>
    <div class="mini"><div class="l">结余</div><div class="v">¥${fmtMoney(balance)}</div></div></div>`;

  // 标签栏
  const tabs = `<div class="money-tabs">
    <div class="money-tab ${moneyFilter==='all'?'on':''}" data-filter="all">全部</div>
    <div class="money-tab ${moneyFilter==='expense'?'on':''}" data-filter="expense">支出</div>
    <div class="money-tab ${moneyFilter==='income'?'on':''}" data-filter="income">收入</div></div>`;

  // 分类汇总
  const cats = m.categories || [];
  const monthExps = it.filter(x=>x.type==="expense" && (x.date||"").startsWith(ym));
  const catAmounts = cats.map(c=>({
    cat: c,
    amount: monthExps.filter(x=>x.category===c).reduce((s,x)=>s+ +x.amount, 0)
  })).filter(x=>x.amount > 0).sort((a,b)=>b.amount-a.amount);
  const catChips = catAmounts.length ? `<div class="cat-chips">${catAmounts.map(c=>{
    const on = moneyCatFilter === c.cat;
    return `<div class="cat-chip ${on?'on':''}" data-cat="${esc(c.cat)}">${esc(c.cat)} ¥${fmtMoney(c.amount)}</div>`;
  }).join("")}</div>` : '';

  // 筛选记录
  let filtered = it;
  if(moneyFilter !== 'all') filtered = filtered.filter(x=>x.type===moneyFilter);
  if(moneyCatFilter) filtered = filtered.filter(x=>x.category===moneyCatFilter);

  const body = filtered.length ? filtered.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>暂无记录</div></div>`;

  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:14px">
      ${summary}
      ${tabs}
      ${catChips}
      <div class="sec-title">记录</div>${body}
    </div>`;

  wireModule("money");

  // 标签栏交互
  $("#screen").querySelectorAll(".money-tab").forEach(el=>el.onclick=()=>{
    moneyFilter = el.dataset.filter;
    moneyCatFilter = null;
    render();
  });
  // 分类筛选交互
  $("#screen").querySelectorAll(".cat-chip").forEach(el=>el.onclick=()=>{
    const cat = el.dataset.cat;
    moneyCatFilter = (moneyCatFilter === cat) ? null : cat;
    render();
  });
}

/* ============================================================
   SLEEP MODULE — 日历 + 建议
   ============================================================ */
let sleepViewMode = 'week';

function renderSleep(){
  const m = modOf("sleep"); const it = data.sleep || [];

  // 视图切换
  const toggle = `<div class="view-toggle">
    <div class="vt-btn ${sleepViewMode==='week'?'on':''}" data-vm="week">周视图</div>
    <div class="vt-btn ${sleepViewMode==='month'?'on':''}" data-vm="month">月视图</div></div>`;

  let viewContent = "";
  if(sleepViewMode === 'week'){
    // 周视图
    const days = [];
    for(let i=6; i>=0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = d.toISOString().slice(0,10);
      const rec = it.find(x=>x.date === ds);
      let status = null;
      let cls = '';
      if(rec){
        status = rec.mood;
        if(status === '良好') cls = 'good';
        else if(status === '偏晚') cls = 'late';
        else if(status === '严重偏晚' || status === '失眠') cls = 'vlate';
      }
      days.push({
        ds, short: `${d.getMonth()+1}/${d.getDate()}`,
        weekday: "日一二三四五六"[d.getDay()],
        bedtime: rec ? rec.bedtime : '--',
        wakeTime: rec ? rec.wakeTime : '--',
        duration: rec ? rec.duration : '--',
        status: status || '未记录',
        cls
      });
    }
    viewContent = `<div class="sleep-week">${days.map(d=>`
      <div class="sleep-day ${d.cls}">
        <div class="sd-date">${d.short}<small>周${d.weekday}</small></div>
        <div class="sd-time">${d.bedtime} → ${d.wakeTime}<small>${d.status}</small></div>
        <div class="sd-dur">${d.duration}</div>
      </div>`).join("")}</div>`;
  } else {
    // 月视图
    const now = new Date();
    const y = now.getFullYear(), mo = now.getMonth();
    const startDow = new Date(y, mo, 1).getDay();
    const days = new Date(y, mo+1, 0).getDate();
    const todayIso = isoToday();
    const dateMap = {};
    it.forEach(r=>{ if(r.date) dateMap[r.date] = r; });
    const colorMap = { '良好':'var(--module-1)', '偏晚':'var(--module-3)', '严重偏晚':'var(--danger)', '失眠':'var(--danger)' };
    let cells = "";
    for(let i=0; i<startDow; i++) cells += `<div class="cal-cell blank"></div>`;
    for(let d=1; d<=days; d++){
      const ds = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const rec = dateMap[ds];
      const bg = rec && colorMap[rec.mood] ? colorMap[rec.mood] : '';
      cells += `<div class="cal-cell ${rec?'on':''} ${ds===todayIso?'today':''}"${rec&&bg?` style="background:${bg};border-color:${bg}"`:''}${rec?` data-edit="${rec.id}"`:''}>${d}</div>`;
    }
    viewContent = `<div class="panel">
      <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-foot" style="margin-top:10px">
        <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--module-1)"></span>良好</span>
        <span style="display:inline-flex;align-items:center;gap:4px;margin-left:12px"><span style="width:8px;height:8px;border-radius:50%;background:var(--module-3)"></span>偏晚</span>
        <span style="display:inline-flex;align-items:center;gap:4px;margin-left:12px"><span style="width:8px;height:8px;border-radius:50%;background:var(--danger)"></span>严重偏晚</span>
      </div></div>`;
  }

  // 汇总
  const recent7 = it.filter(x=>x.bedtime).slice(-7);
  const sleepAvg = avgBedtime(it);
  let avgDur = '--';
  if(recent7.length){
    const durNums = recent7.map(x=>{
      const m = (x.duration||'').match(/[\d.]+/);
      return m ? parseFloat(m[0]) : null;
    }).filter(x=>x!==null);
    if(durNums.length) avgDur = (durNums.reduce((a,b)=>a+b,0)/durNums.length).toFixed(1) + 'h';
  }
  const summary = `<div class="sleep-summary">
    <div class="ss-cell"><div class="ss-v">${sleepAvg}</div><div class="ss-l">平均入睡</div></div>
    <div class="ss-cell"><div class="ss-v">${avgDur}</div><div class="ss-l">平均时长</div></div></div>`;

  // 建议
  let advice = "暂无作息记录。";
  if(recent7.length){
    const avgMins = parseBedtimeMinutes(sleepAvg);
    if(avgMins !== null && avgMins >= 120){
      advice = "作息持续偏晚（凌晨3-5点入睡），影响恢复和减脂效率。建议每周提前15分钟入睡。";
    } else if(avgMins !== null && avgMins >= 0){
      advice = "入睡时间偏晚（凌晨0-2点），建议逐步调整到0点前入睡。";
    } else {
      advice = "作息时间良好，继续保持。";
    }
  }
  const adviceBox = `<div class="advice-box">
    <div class="ab-title">${icon("bolt",14)} 建议</div>${advice}</div>`;

  const body = it.length ? it.slice().reverse().map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录</div></div>`;

  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:14px">
      ${summary}
      ${toggle}
      ${viewContent}
      ${adviceBox}
      <div class="sec-title">记录</div>${body}
    </div>`;
  wireModule("sleep");

  // 视图切换交互
  $("#screen").querySelectorAll(".vt-btn").forEach(el=>el.onclick=()=>{
    sleepViewMode = el.dataset.vm;
    render();
  });
}

/* ============================================================
   RECORD HTML — ticktick-like todo/checkin
   ============================================================ */
function recHTML(m, x){
  const pin = `<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del = `<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts = `<div class="acts">${pin}${del}</div>`;
  const chkMark = icon("check",14,2.4);
  const thumb = x.image ? `<img class="thumb" src="${attr(x.image)}" alt="">` : '';
  const customMeta = (m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(f.label.split('(')[0])}: ${esc(x[f.key])}</span>`).join("");
  const customBlock = customMeta ? `<div class="meta-line">${customMeta}</div>` : '';

  if(m.type === "todo"){
    const p = (m.priorities||[]).find(p=>p.key===x.priority);
    const dotColor = p ? p.text : 'var(--text-tertiary)';
    return `<div class="rec">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">
        ${p?`<span class="prio-dot" style="background:${dotColor}"></span>`:''}${esc(x.title)}
      </div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type === "checkin"){
    const on = !!(x.log && x.log[today()]); const st = streak(x.log);
    return `<div class="rec">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type === "progress"){
    const pct = Math.min(100, Math.round((x.current/x.target)*100||0));
    return `<div class="rec">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px;font-variant-numeric:tabular-nums">${x.current}/${x.target} ${esc(x.unit||m.unit||'')} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type === "finance"){
    const inc = x.type === "income";
    return `<div class="rec">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${fmtDate(x.date)}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${fmtMoney(+x.amount||0)}</div></div></div>`;
  }
  // note
  return `<div class="rec">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${fmtDate(x.date)}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m = modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

/* ============================================================
   CALENDAR (checkin)
   ============================================================ */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

/* ============================================================
   EDITOR MODAL
   ============================================================ */
function openEditor(key, item){
  if(pref.readonly) return;
  const m=modOf(key); const editing=!!item;
  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧圆圈打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="动作名称"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;

  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ============================================================
   ROUTER / NAV
   ============================================================ */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  if(view==="home"){ $("#topTitle").firstChild.textContent="我的生活"; $("#topSub").textContent=CONFIG.slogan; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="洞察"; $("#topSub").textContent="统计与复盘"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:"我的生活"; $("#topSub").textContent=m?m.desc:""; }
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ============================================================
   DATA EXPORT
   ============================================================ */
function exportData(){
  const exportObj = {
    exportDate: isoToday(),
    storageKey: CONFIG.storageKey,
    seedVersion: CONFIG.seedVersion,
    modules: CONFIG.modules.map(m => ({ key: m.key, name: m.name, type: m.type })),
    data: data,
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-dashboard-${isoToday()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

/* ============================================================
   DRAWER
   ============================================================ */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}洞察</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ============================================================
   WIRE CHROME
   ============================================================ */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#btn-export").onclick=exportData;

/* ---------- preferences wiring ---------- */
$("#sw-dark").onclick = () => { pref.dark = !pref.dark; savePref(pref); applyPref(); };
$("#sw-edit").onclick = () => { pref.readonly = !pref.readonly; savePref(pref); applyPref(); render(); };

$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

/* ---------- avatar upload ---------- */
$("#brandCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#brandImg").src = data.__avatar;
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

buildDrawer();
render();
</script>
</body>
</html>
